name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  qualidade:
    name: Lint, build, testes e auditoria
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo para que a varredura de segredos cubra os commits.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        env:
          VITE_API_URL: https://dev.ladesa.com.br/api/v1
          VITE_AUTH_MODE: bearer
        run: npm run build

      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=high

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep 'linux_x64.tar.gz' "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks

      # Falha obrigatória: segredo detectado interrompe o pipeline.
      - name: Varrer working tree
        run: gitleaks dir . --config .gitleaks.toml --redact -v

      - name: Varrer histórico
        run: gitleaks detect --source . --config .gitleaks.toml --redact -v
