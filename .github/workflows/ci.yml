name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  GITLEAKS_VERSION: 8.30.1
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  qualidade:
    name: Lint, build, testes e auditoria
    runs-on: ubuntu-latest
    container:
      image: node:22-alpine
    steps:
      - name: Instalar git e dependências do sistema
        run: apk add --no-cache git

      - uses: actions/checkout@v4

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        env:
          VITE_API_URL: https://dev.ladesa.com.br/api/v1
          VITE_AUTH_MODE: bearer
        run: npm run build

      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=high

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep 'linux_x64.tar.gz' "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks

      # Falha obrigatória: segredo detectado interrompe o pipeline.
      - name: Varrer working tree
        run: gitleaks dir . --config .gitleaks.toml --redact -v

      - name: Varrer histórico
        run: gitleaks detect --source . --config .gitleaks.toml --redact -v

  publish:
    name: Build e Push Docker
    needs: [qualidade, segredos]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,format=short,prefix=,suffix=,enable=true

      - name: Build e Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=https://dev.ladesa.com.br/api/v1
            VITE_AUTH_MODE=bearer
